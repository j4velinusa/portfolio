name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A post published from /admin lands as a commit, so the same gate runs on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci, not install — the committed lockfile is the source of truth.
      - run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Only production dependencies can be reached by a visitor; dev-tool
      # advisories are noise for a static site and must not block a release.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Security regressions
        run: node scripts/security-check.mjs

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
